[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aura-ai"
version = "0.2.0"
description = "Artificial Universal Responsive Assistant"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.99.0",
    "pydantic-settings>=2.10.0",
    "rich>=14.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["black>=25.0.0", "pytest>=8.4.0", "ruff>=0.12.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["aura", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.setuptools.packages.find]
include = ["aura*"]
